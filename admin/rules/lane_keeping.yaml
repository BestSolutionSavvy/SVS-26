metadata:
  title: lane_keeping
  warning_threshold: 0.4
  violation_threshold: 0.7
state_machine:
  direction: LR
  initial_state: idle
  states:
    - idle
    - warning
    - violation
  transitions:
    - from: "[*]"
      to: idle
    - from: idle
      to: warning
      conditions:
        - "abs_lane_deviation > warning_threshold AND line_countinous"
        - "abs_lane_deviation > warning_threshold AND line_dashed AND indicator != direction"
    - from: warning
      to: idle
      conditions:
        - "line_dashed AND (indicator == direction OR abs_lane_deviation <= warning_threshold)"
        - "line_countinous AND abs_lane_deviation <= warning_threshold"
    - from: warning
      to: violation
      condition: "abs_lane_deviation > violation_threshold"
    - from: violation
      to: idle
      condition: "abs_lane_deviation <= warning_threshold"
