metadata:
  title: lane_keeping
  severity: 4
  fine: 350
state_machine:
  direction: TB
  initial_state: idle
  states:
    - idle
    - warning_continous
    - warning_dashed
    - violation
  transitions:
    - from: "[*]"
      to: idle
    - from: idle
      to: warning_continous
      condition: "abs_lane_deviation > 0.4m AND line_countinous"
    - from: idle
      to: warning_dashed
      condition: "abs_lane_deviation > 0.4m AND line_dashed AND indicator != direction"
    - from: warning_dashed
      to: idle
      condition: "indicator == direction OR abs_lane_deviation <= 0.4m"
    - from: warning_dashed
      to: violation
      condition: "abs_lane_deviation > 0.7m"
    - from: warning_continous
      to: idle
      condition: "abs_lane_deviation <= 0.4m"
    - from: warning_continous
      to: violation
      condition: "abs_lane_deviation > 0.7m"
    - from: violation
      to: idle
      condition: "abs_lane_deviation <= 0.4m"
