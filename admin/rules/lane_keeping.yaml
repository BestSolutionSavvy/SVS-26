metadata:
  title: lane_keeping
state_machine:
  direction: LR
  initial_state: idle
  states:
    - idle
    - warning
    - violation
  transitions:
    - from: "[*]"
      to: idle
    - from: idle
      to: warning
      conditions:
        - "abs_lane_deviation > 0.4 AND line_countinous"
        - "abs_lane_deviation > 0.4 AND line_dashed AND indicator != direction"
    - from: warning
      to: idle
      conditions:
        - "line_dashed AND (indicator == direction OR abs_lane_deviation <= 0.4)"
        - "line_countinous AND abs_lane_deviation <= 0.4"
    - from: warning
      to: violation
      condition: "abs_lane_deviation > 0.7"
    - from: violation
      to: idle
      condition: "abs_lane_deviation <= 0.4"
