metadata:
  title: lane_keeping
  constants:
    warning_threshold: 0.4
    violation_threshold: 0.7
state_machine:
  direction: TB
  initial_state: idle
  states:
  - idle
  - idle_continous
  - warning
  - idle_dashed
  - violation
  transitions:
  - from: '[*]'
    to: idle
  - from: idle
    to: idle_continous
    condition: line_continuous
  - from: idle_continous
    to: warning
    condition: abs_lane_deviation > warning_threshold and (indicator == None or indicator != direction)
  - from: idle_dashed
    to: warning
    condition: abs_lane_deviation > warning_threshold and indicator == None
  - from: idle
    to: idle_dashed
    condition: line_dashed
  - from: idle_continous
    to: idle
    condition: line_dashed
  - from: idle_dashed
    to: idle
    condition: line_continuous
  - from: warning
    to: idle_dashed
    condition: line_dashed and (indicator == direction or abs_lane_deviation <= warning_threshold)
  - from: warning
    to: idle_continous
    condition: line_continuous and abs_lane_deviation <= warning_threshold
  - from: warning
    to: violation
    condition: abs_lane_deviation > violation_threshold
  - from: violation
    to: idle
    condition: abs_lane_deviation <= warning_threshold
