metadata:
  title: safe_distance
  severity: 3
  fine: 250
state_machine:
  direction: TB
  initial_state: safe
  states:
    - safe
    - warning
    - emergency_braking
    - violation
  transitions:
    - from: "[*]"
      to: safe
    - from: safe
      to: warning
      condition: "distance_to_lead < threshold_min OR ttc < 2.5s"
    - from: warning
      to: safe
      condition: "distance_to_lead > threshold_safe AND ttc > 3.0s"
    - from: warning
      to: emergency_braking
      condition: "ttc < 1.0s"
    - from: emergency_braking
      to: safe
      condition: "ego_speed == 0"
    - from: warning
      to: violation
      condition: "distance_to_lead <= 0"
