metadata:
  title: safe_distance
  constants:
    speed_multiplier_safe: 0.5
    speed_multiplier_min: 0.25
    weather_factor: 1.3
state_machine:
  direction: TB
  initial_state: idle
  states:
  - idle
  - warning
  - violation
  transitions:
  - from: '[*]'
    to: idle
  - from: idle
    to: warning
    condition: distance_to_lead < threshold_safe
  - from: warning
    to: idle
    condition: distance_to_lead >= threshold_safe
  - from: warning
    to: violation
    condition: distance_to_lead < threshold_min
  - from: violation
    to: warning
    condition: distance_to_lead >= threshold_min
