metadata:
  title: right_of_way
state_machine:
  direction: LR
  initial_state: idle
  states:
  - idle
  - intersection
  - warning
  - violation
  transitions:
  - from: '[*]'
    to: idle
  - from: idle
    to: intersection
    condition: in_intersection == True and precedence == True
  - from: intersection
    to: warning
    condition: broad_right_occupied == True
  - from: warning
    to: intersection
    condition: broad_right_occupied == False
  - from: warning
    to: idle
    condition: in_intersection == False
  - from: warning
    to: violation
    condition: narrow_right_occupied == True
  - from: violation
    to: idle
    condition: in_intersection == False
  - from: intersection
    to: idle
    condition: in_intersection == False
