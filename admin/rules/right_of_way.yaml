metadata:
  title: right_of_way
  severity: 4
  fine: 400
state_machine:
  direction: TB
  initial_state: idle
  states:
    - idle
    - intersection
    - "intersection.start"
    - "intersection.warning"
    - "intersection.end"
    - "intersection.violation"
  transitions:
    - from: "[*]"
      to: idle
    - from: idle
      to: intersection
      condition: "ego_location == in_intersection AND precedence == True"
    - from: intersection
      to: idle
      condition: "ego_location != in_intersection"
    - from: "intersection.start"
      to: "intersection.warning"
      condition: "broad_right_occupied == True"
    - from: "intersection.warning"
      to: "intersection.end"
      condition: "broad_right_occupied == False"
    - from: "intersection.warning"
      to: "intersection.violation"
      condition: "narrow_right_occupied == True"
