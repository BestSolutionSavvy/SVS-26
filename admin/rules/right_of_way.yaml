metadata:
  title: right_of_way
state_machine:
  direction: LR
  initial_state: idle
  states:
  - idle
  - intersection
  - warning
  - violation
  transitions:
  - from: '[*]'
    to: idle
  - from: idle
    to: intersection
    condition: in_intersection == True
  - from: intersection
    to: warning
    condition: right_wedge_far == True and other_can_enter_intersection == True
  - from: warning
    to: intersection
    condition: right_wedge_far == False
  - from: warning
    to: violation
    condition: right_wedge_near == True and other_can_enter_intersection == True
  - from: violation
    to: idle
    condition: in_intersection == False
  - from: intersection
    to: idle
    condition: in_intersection == False
  - from: warning
    to: idle
    condition: in_intersection == False
