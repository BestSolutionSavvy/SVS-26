metadata:
  title: Stop
state_machine:
  direction: LR
  initial_state: idle
  states:
    - idle
    - warning
    - stopped
    - violation
  transitions:
    - from: "[*]"
      to: idle
    - from: idle
      to: warning
      condition: "distance_to_sign <= 10"
    - from: warning
      to: stopped
      condition: "ego_speed == 0.0 AND distance_to_sign <= 1"
    - from: stopped
      to: idle
      condition: "ego_speed >= 0.5"
    - from: warning
      to: violation
      condition: "ego_speed > 0.0 distance_to_sign == 0"
    - from: violation
      to: idle
      condition: "distance_to_sign > 10"
