metadata:
  title: Stop
  severity: 4
  fine: 250
state_machine:
  direction: TB
  initial_state: idle
  states:
    - idle
    - approaching
    - stopped
    - violation
  transitions:
    - from: "[*]"
      to: idle
    - from: idle
      to: approaching
      condition: "near_stop_sign == True AND distance_to_sign <= 20"
    - from: approaching
      to: stopped
      condition: "ego_speed < 0.5"
    - from: approaching
      to: violation
      condition: "distance_to_sign <= 0"
    - from: stopped
      to: idle
      condition: "ego_speed >= 0.5"
    - from: violation
      to: idle
      condition: "after(20 seconds)"
