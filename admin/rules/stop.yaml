metadata:
  title: Stop
  constants:
    warning_threshold: 10
    stop_threshold: 2
    stop_departure_speed: 0.5
state_machine:
  direction: LR
  initial_state: idle
  states:
  - idle
  - warning
  - stopped
  - violation
  transitions:
  - from: '[*]'
    to: idle
  - from: idle
    to: warning
    condition: distance_to_stop <= warning_threshold and distance_to_stop > stop_threshold
  - from: warning
    to: stopped
    condition: ego_speed == 0.0 and distance_to_stop <= stop_threshold
  - from: stopped
    to: idle
    condition: ego_speed >= stop_departure_speed
  - from: warning
    to: violation
    condition: ego_speed > 0.0 and distance_to_stop <= 0.0
  - from: warning
    to: idle
    condition: distance_to_stop > warning_threshold
  - from: violation
    to: idle
    condition: distance_to_stop > warning_threshold
